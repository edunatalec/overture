name: PR

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run the release checks
        run: ./scripts/verify.sh

  floor:
    name: Floor (lowest supported Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Read the SDK floor from pubspec.yaml
        id: floor
        run: |
          FLOOR=$(grep -E "^  flutter:" pubspec.yaml | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -n1)
          echo "Floor declared in pubspec.yaml: $FLOOR"
          echo "version=$FLOOR" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.floor.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Analyze the example app
        run: cd example && flutter pub get && flutter analyze
